<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALEM Akış</title>
<!--
  Canlı İşlem Akışı paneli — minimal, "borsa/canlı izleme ekranı" hissi.

  YERLEŞİM MANTIĞI (kullanıcı kuralı):
  - Sıralı (birbirinin sonucu olan) adımlar → DİKEY, alt alta.
  - Gerçekten eşzamanlı/paralel adımlar → YATAY, yan yana.

  Tek GERÇEK paralel nokta: Havuz 1/3/4 — üçü de AYNI 'distribution'
  olayına bağlı, kontratın tek bir invocation'ı içinde atomik olarak
  gerçekleşiyor (bkz. contracts/pool-manager/src/distribution.rs).

  DİKKAT — GİB paralel DEĞİL: `sse-listener.service.js`da
  `generateGibDocument()`, 'caught' olayı zaten kaydedildikten SONRA,
  aynı fonksiyon içinde sırayla çağrılıyor; gib.at her zaman
  caught.at'ten sonradır. Bu yüzden Onaylandı → GİB Belgesi → Esnaf
  burada SIRALI (alt alta) çizilir, yan yana DEĞİL — kullanıcının
  ilk talimatındaki "paralel" varsayımı koddaki gerçek sırayla
  eşleşmiyordu, düzeltilerek uygulandı (bkz. proje sohbeti, 17 Eylül).

  KURAL: Sayfada düğüm adları DIŞINDA hiçbir metin yok — tutar, yüzde,
  hash, adres, zaman damgası YAZILMAZ. Bir boru, hedef düğümün GERÇEK
  backend olayı "done" olduğunda dolar (bkz. computeStatuses).

  Sayfa artık viewport'a ZORLA sığdırılmıyor — doğal boyutunda akar;
  taşarsa sayfa kendiliğinden, yumuşak kayarak aktif adımı takip eder
  (bkz. scrollToActive). "Tek ekrana sığsın" kısıtı KASITLI olarak yok.

  Kullanım: https://<backend>/flow?token=<FLOW_PANEL_TOKEN>
  Harici kaynak yok (font/CDN) — sunum ağı kısıtlıysa da çalışır.
-->
<style>
  :root {
    /* Sıcak ten rengi ↔ beyaz arası, yumuşak krem. */
    --bg: #F7ECE0;
    --pipe-empty: #E0C9AF;
    --pipe-fill: #22A854;
    --pipe-glow: rgba(34, 168, 84, .4);
    --pipe-fail: #E2493D;
    --node-bg: #FFFBF5;
    --node-stroke: #D8BE9E;
    --node-active: #E2984A;
    --text: #3E2E20;
    --text-dim: #B49A7C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    display: flex; justify-content: center;
    min-height: 100vh; padding: 48px 16px;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif;
  }
  svg#diagram {
    /* Genişlik sınırlı/ortalı (okunaklı + projektörde dengeli), YÜKSEKLİK
       DOĞAL — viewBox oranını kendiliğinden korur. Sığmazsa sayfa kaydırılır
       (KASITLI: "tek ekrana sığsın" kısıtı kaldırıldı). */
    width: min(92vw, 760px);
    height: auto;
    display: block;
  }
  .pipe { fill: none; stroke-linecap: round; }
  .pipe-empty { stroke: var(--pipe-empty); }
  /* ÇOK YUMUŞAK dolum: yavaş başlayıp yavaş biten kadifemsi bir eğri +
     yeşil parlama (glow) + gradient dolgu (aşağıya doğru ton geçişi,
     "sıvı ışığı yakalıyor" hissi) — sert/dijital bir çizgi değil. */
  .pipe-fill {
    stroke: url(#liquidGrad);
    transition: stroke-dashoffset 1.7s cubic-bezier(.33, .0, .18, 1);
    filter: drop-shadow(0 0 8px var(--pipe-glow));
  }
  .pipe-fill.fail { stroke: url(#liquidFailGrad); filter: drop-shadow(0 0 8px rgba(226, 73, 61, .38)); }

  /* Borunun içinde akan, yumuşak bulanık bir ışık noktası — CSS motion-path
     ile aynı borunun "d"sini izler. Yalnızca YENİ dolan bir boruda bir kez
     belirir. */
  .flow-dot { fill: #F1FCF3; opacity: 0; filter: blur(4px) drop-shadow(0 0 12px var(--pipe-fill)); }
  .flow-dot.run { animation: flowdot var(--dur, 1.7s) cubic-bezier(.33, .0, .18, 1) forwards; }
  @keyframes flowdot {
    0%   { offset-distance: 0%;   opacity: 0; }
    8%   { opacity: .95; }
    88%  { opacity: .95; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  /* .ring TEMEL durumda görünmez olmalı (yalnızca .active iken belirir) —
     bu kural eksikti ve SVG varsayılanı (fill:black) her düğümde ince
     siyah bir halka olarak sızıyordu (gerçek cihazda bulundu). */
  .ring { fill: none; stroke: none; }
  .node circle.body { stroke-width: 6; transition: fill .5s ease, stroke .5s ease; filter: drop-shadow(0 3px 10px rgba(80, 60, 40, .16)); }
  .node.pending circle.body { fill: var(--node-bg); stroke: var(--node-stroke); }
  .node.active circle.body { fill: var(--node-bg); stroke: var(--node-active); }
  .node.done circle.body { fill: url(#nodeDoneGrad); stroke: var(--pipe-fill); }
  .node.failed circle.body { fill: url(#nodeFailGrad); stroke: var(--pipe-fail); }

  /* Boru tam dolup düğüme ulaştığında YUMUŞAK bir "nefes alma". */
  .node { transform-box: fill-box; transform-origin: center; }
  .node.settle { animation: settle 1s cubic-bezier(.22, .7, .3, 1); }
  @keyframes settle {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.13); }
    100% { transform: scale(1); }
  }

  .node.active .ring {
    fill: none; stroke: var(--node-active); stroke-width: 4; opacity: .55;
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    from { r: var(--r0); opacity: .6; }
    to   { r: var(--r1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .node.active .ring { animation: none; }
    .node.settle { animation: none; }
    .flow-dot.run { animation: none; }
  }

  .label {
    font-size: 30px; font-weight: 700; text-anchor: middle;
    fill: var(--text-dim); transition: fill .5s ease;
  }
  .node.active .label, .node.done .label, .node.failed .label { fill: var(--text); }

  #conn {
    position: fixed; top: 18px; right: 18px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--text-dim);
  }
  #conn[data-state="live"] { background: var(--pipe-fill); }
  #conn[data-state="retry"] { background: var(--node-active); }
  #conn[data-state="error"] { background: var(--pipe-fail); }
</style>
</head>
<body>
<div id="conn" data-state="connecting"></div>
<svg id="diagram" viewBox="0 0 700 1340" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <!-- "Sıvı" gradyanı: TÜM diyagram boyunca sabit, mutlak (userSpaceOnUse)
         koordinatlarla — yukarıdan aşağı ton geçişi, akış yönünü hissettirir.
         DİKKAT: gradientUnits VARSAYILANI (objectBoundingBox) kullanılırsa
         TAM DÜZ (dikey) borularda sınır kutusu genişliği SIFIR olur ve
         gradyan bazı tarayıcılarda tamamen GÖRÜNMEZ kalır — gerçek cihazda
         bulundu (Müşteri→Kontrat ve Onaylandı→GİB→Esnaf boruları yeşile
         hiç dönmüyordu). userSpaceOnUse + viewBox'ın tam boyu bu hatayı
         yapısal olarak ortadan kaldırır. -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6BDB93" />
      <stop offset="100%" stop-color="#1C8E48" />
    </linearGradient>
    <linearGradient id="liquidFailGrad" x1="0" y1="0" x2="0" y2="1340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0857A" />
      <stop offset="100%" stop-color="#C73528" />
    </linearGradient>
    <radialGradient id="nodeDoneGrad" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#8FE6AC" />
      <stop offset="100%" stop-color="#1F9B4C" />
    </radialGradient>
    <radialGradient id="nodeFailGrad" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#F3A199" />
      <stop offset="100%" stop-color="#C73528" />
    </radialGradient>
  </defs>
</svg>

<script>
(() => {
  'use strict';

  const token = new URLSearchParams(location.search).get('token') || '';
  const svg = document.getElementById('diagram');
  const conn = document.getElementById('conn');
  const NS = 'http://www.w3.org/2000/svg';
  const R = 62; // düğüm yarıçapı — büyük, uzaktan net
  const STROKE_W = 32; // boru kalınlığı

  /**
   * Düğümler — sabit koordinatlar (viewBox 700×1340).
   *
   * DİKEY sıra = backend'de GERÇEKTEN sıralı (birbirinin sonucu) olan
   * adımlar. Havuz 1/3/4 aynı satırda (YATAY) çünkü GERÇEKTEN paralel/atomik.
   */
  const NODES = {
    customer:  { x: 350, y: 100,  label: ['Müşteri'] },
    contract:  { x: 350, y: 320,  label: ['Kontrat'] },
    pool1:     { x: 130, y: 545,  label: ['Havuz 1', '(Esnaf Kasası)'] },
    pool3:     { x: 350, y: 545,  label: ['Havuz 3', '(Sosyal)'] },
    pool4:     { x: 570, y: 545,  label: ['Havuz 4', '(Operasyonel)'] },
    confirmed: { x: 350, y: 770,  label: ['Onaylandı'] },
    gib:       { x: 350, y: 985,  label: ['GİB Belgesi'] },
    merchant:  { x: 350, y: 1200, label: ['Esnaf'] },
  };

  /** Her boru: kaynak/hedef düğüm. Durumu hedef düğümün durumu belirler. */
  const EDGES = [
    { from: 'customer', to: 'contract' },
    { from: 'contract', to: 'pool1' },
    { from: 'contract', to: 'pool3' },
    { from: 'contract', to: 'pool4' },
    { from: 'pool1', to: 'confirmed' },
    { from: 'pool3', to: 'confirmed' },
    { from: 'pool4', to: 'confirmed' },
    { from: 'confirmed', to: 'gib' },
    { from: 'gib', to: 'merchant' },
  ];

  let current = null;

  /**
   * Backend'in 9 gerçek adımını (FLOW_STEPS) 8 görsel düğüme indirger.
   * Yalnızca ilgili backend olayı GERÇEKTEN geldiğinde durum değişir.
   */
  function computeStatuses(flow) {
    const byStep = {};
    for (const e of flow.events) byStep[e.step] = e.status;

    function group(steps) {
      if (steps.some((s) => byStep[s] === 'failed')) return 'failed';
      if (steps.every((s) => byStep[s] === 'done')) return 'done';
      return steps.some((s) => byStep[s] != null) ? 'active' : 'pending';
    }
    // Önceki adım 'failed' olsa bile bu adım 'pending' döner — GERÇEKTEN
    // hiç başlamadı; kırmızı yalnızca GERÇEK hata noktasında olmalı.
    //
    // BULUNAN HATA: Onaylandı/GİB/Esnaf/Havuzlar gibi TEK backend adımına
    // bağlı düğümler `group()`dan hep 'pending' alıyordu (o TEK adımın
    // olayı henüz gelmemişken) — asla 'active' (nabız atan, "şu an
    // bekleniyor") olamıyorlardı; sadece 4 alt-adımlı 'contract' checkpoint'i
    // (received/fee_bump/submitted/contract) bunu gösterebiliyordu. Sonucu:
    // hem görsel nabız kaybolıyordu hem otomatik kaydırma (.node.active
    // arayan) hep en alta atlıyordu. Düzeltme: ÖNCEKİ adım bittiyse ama BU
    // adımın kendi olayı hiç gelmediyse ('pending' dönerse), bu artık
    // "hiç başlamadı" değil "ŞİMDİ bekleniyor" demektir — 'active' olmalı.
    function next(prevStatus, steps) {
      if (prevStatus !== 'done') return 'pending';
      const g = group(steps);
      return g === 'pending' ? 'active' : g;
    }

    const customer = group(['signed']);
    const contract = next(customer, ['received', 'fee_bump', 'submitted', 'contract']);
    // Havuz 1/3/4 AYNI 'distribution' olayına bağlı — üçü HER ZAMAN birebir
    // aynı durumda: gerçekte atomik olduğu için, tahmini eşitleme değil.
    const poolStatus = next(contract, ['distribution']);
    const confirmed = next(poolStatus, ['caught']);
    // SIRALI (yan yana DEĞİL) — bkz. dosya başı notu: gib.at HER ZAMAN caught.at'ten sonra.
    const gib = next(confirmed, ['gib']);
    const merchant = next(gib, ['merchant_seen']);

    return {
      customer, contract,
      pool1: poolStatus, pool3: poolStatus, pool4: poolStatus,
      confirmed, gib, merchant,
    };
  }

  function edgeStatus(statuses, edge) {
    return statuses[edge.to];
  }

  function pathFor(edge) {
    const a = NODES[edge.from], b = NODES[edge.to];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const x1 = a.x + ux * R, y1 = a.y + uy * R;
    const x2 = b.x - ux * R, y2 = b.y - uy * R;
    return `M ${x1} ${y1} L ${x2} ${y2}`;
  }

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  function buildStaticDiagram() {
    const frag = document.createDocumentFragment();

    for (const edge of EDGES) {
      frag.appendChild(el('path', { class: 'pipe pipe-empty', d: pathFor(edge), 'stroke-width': STROKE_W }));
    }
    for (const edge of EDGES) {
      const p = el('path', { class: 'pipe pipe-fill', d: pathFor(edge), 'stroke-width': STROKE_W, 'data-edge': `${edge.from}>${edge.to}` });
      frag.appendChild(p);
    }
    for (const [key, n] of Object.entries(NODES)) {
      const g = el('g', { class: 'node pending', 'data-node': key });
      g.appendChild(el('circle', { class: 'ring', cx: n.x, cy: n.y, r: R + 10, style: `--r0:${R + 6}px; --r1:${R + 28}px` }));
      g.appendChild(el('circle', { class: 'body', cx: n.x, cy: n.y, r: R }));
      n.label.forEach((line, i) => {
        const dy = n.label.length === 1 ? R + 42 : R + 38 + i * 34;
        g.appendChild(el('text', { class: 'label', x: n.x, y: n.y + dy })).textContent = line;
      });
      frag.appendChild(g);
    }
    svg.appendChild(frag);
  }

  const FLOW_DURATION_MS = 1700; // .pipe-fill / .flow-dot.run CSS süresiyle BİREBİR eşleşmeli
  let supportsMotionPath = false;
  try { supportsMotionPath = CSS.supports('offset-path', "path('M0 0L1 1')"); } catch { /* eski tarayıcı — nokta efekti atlanır */ }

  /** Önceki render'daki durumlar — yalnızca GERÇEKTEN YENİ dolan kenar/düğümde animasyon oynatmak için. */
  let prevStatuses = null;

  function spawnFlowDot(edge) {
    if (!supportsMotionPath) return;
    const dot = el('circle', { class: 'flow-dot', r: 10 });
    dot.style.offsetPath = `path('${pathFor(edge)}')`;
    dot.style.setProperty('--dur', `${FLOW_DURATION_MS}ms`);
    svg.appendChild(dot);
    requestAnimationFrame(() => dot.classList.add('run'));
    setTimeout(() => dot.remove(), FLOW_DURATION_MS + 200);
  }

  /**
   * `animate=false` ilk anlık görüntüde (sayfa yeni açıldı/yeniden
   * bağlandı) kullanılır — geçmiş adımlar SIÇRAMADAN anında dolu görünür.
   * Akış/nefes efekti yalnızca YENİ gelen bir olayda (bu render'da GERÇEKTEN
   * durum değiştiğinde) oynar — aksi halde her yeni olayda TÜM geçmiş
   * borular baştan "dolarmış" gibi yeniden animasyon oynardı.
   */
  function applyStatuses(statuses, animate) {
    for (const [key, status] of Object.entries(statuses)) {
      const g = svg.querySelector(`[data-node="${key}"]`);
      if (!g) continue;
      const prevStatus = prevStatuses && prevStatuses[key];
      g.setAttribute('class', `node ${status}`);
      const justSettled = animate && prevStatus !== status && (status === 'done' || status === 'failed');
      if (justSettled) {
        g.classList.remove('settle');
        void g.getBoundingClientRect();
        g.classList.add('settle');
      }
    }
    for (const edge of EDGES) {
      const status = edgeStatus(statuses, edge);
      const prevStatus = prevStatuses ? edgeStatus(prevStatuses, edge) : null;
      const p = svg.querySelector(`[data-edge="${edge.from}>${edge.to}"]`);
      if (!p) continue;
      const filled = status === 'done' || status === 'failed';
      const wasFilled = prevStatus === 'done' || prevStatus === 'failed';
      p.classList.toggle('fail', status === 'failed');
      const len = p.getTotalLength();
      // İKİ DEĞERLİ dasharray (dolu, ÇOK BÜYÜK boşluk) — TEK değerli
      // dasharray "dolu,dolu" olarak tekrar eder; dashoffset=len ile
      // gizlemeye çalışınca kayan noktalı yuvarlama, desenin "dolu"
      // kısmının TAM borunun bittiği ucuna denk gelmesine yol açıp orada
      // küçük bir nokta/parça sızdırıyordu (gerçek cihazda bulundu — ilk
      // düzeltme denemesi de yanlış yöne gidip sızıntıyı BÜYÜTTÜ). Boşluğu
      // yolun kendisinden kat kat büyük tutmak, desenin hiç tekrar
      // ETMEMESİNİ sağlar — sınırda hiçbir yuvarlama artık "dolu"ya denk
      // gelemez, sızıntı yapısal olarak imkânsız hale gelir.
      const GAP = len * 4 + STROKE_W * 4;
      p.setAttribute('stroke-dasharray', `${len} ${GAP}`);
      if (!filled) {
        p.style.transition = 'none';
        p.setAttribute('stroke-dashoffset', `${len}`);
        continue;
      }
      if (!animate || wasFilled) {
        p.style.transition = 'none';
        p.setAttribute('stroke-dashoffset', '0');
        continue;
      }
      p.setAttribute('stroke-dashoffset', `${len}`);
      p.style.transition = 'none';
      void p.getBoundingClientRect();
      p.style.transition = '';
      p.setAttribute('stroke-dashoffset', '0');
      spawnFlowDot(edge);
    }
    prevStatuses = statuses;
  }

  function render(flow, animate) {
    if (!flow) {
      applyStatuses(
        { customer: 'pending', contract: 'pending', pool1: 'pending', pool3: 'pending', pool4: 'pending', confirmed: 'pending', gib: 'pending', merchant: 'pending' },
        false
      );
      return;
    }
    applyStatuses(computeStatuses(flow), animate);
  }

  function reducedMotion() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  /**
   * Sayfa artık viewport'a zorla sığdırılmıyor — taşarsa doğal olarak
   * kayar. Bu yüzden takip otomatiktir: aktif (bekleyen) düğüm varsa ona,
   * her şey bittiyse son düğüme, kullanıcı hiç scroll yapmadan yumuşak kayar.
   */
  function scrollToActive() {
    const target = svg.querySelector('.node.active') || [...svg.querySelectorAll('.node')].pop();
    target?.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
  }

  function accept(flow) {
    if (flow && current && flow.transactionId !== current.transactionId
        && new Date(flow.createdAt) < new Date(current.createdAt)) return;
    const isNewTx = !current || !flow || flow.transactionId !== current.transactionId;
    current = flow;
    render(flow, !isNewTx);
    if (isNewTx) {
      window.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' });
    } else {
      scrollToActive();
    }
  }

  function setConn(state) {
    conn.dataset.state = state;
  }

  buildStaticDiagram();

  if (!token) {
    setConn('error');
    return;
  }

  const qs = `token=${encodeURIComponent(token)}`;
  const es = new EventSource(`/api/v1/flow/stream?${qs}`);

  es.addEventListener('open', () => setConn('live'));
  es.addEventListener('snapshot', (m) => accept(JSON.parse(m.data).flow));
  es.addEventListener('flow', (m) => accept(JSON.parse(m.data).flow));
  es.addEventListener('error', () => {
    setConn(es.readyState === EventSource.CLOSED ? 'error' : 'retry');
  });
})();
</script>
</body>
</html>
