<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALEM Akış</title>
<!--
  Canlı İşlem Akışı paneli — MİNİMAL sürüm (15 Eylül tasarımı tamamen
  atıldı, kullanıcı isteğiyle sıfırdan yazıldı).

  KURAL: Sayfada düğüm adları DIŞINDA hiçbir metin yok — tutar, yüzde,
  hash, adres, zaman damgası YAZILMAZ. Yalnızca 7 düğüm (Müşteri, Kontrat,
  3 havuz, Onaylandı, Esnaf) ve onları birbirine bağlayan borular vardır.

  Bir boru, hedef düğümün GERÇEK backend olayı "done" olduğunda yeşile
  dolar (bkz. computeStatuses). Havuz 1/3/4 aynı 'distribution' olayına
  bağlı olduğu için üçü HER ZAMAN aynı anda dolar — bu tahmin değil,
  gerçekten atomik olduğu için böyle.

  Kullanım: https://<backend>/flow?token=<FLOW_PANEL_TOKEN>
  Harici kaynak yok (font/CDN) — sunum ağı kısıtlıysa da çalışır.
-->
<style>
  :root {
    /* Sıcak ten rengi ↔ beyaz arası, yumuşak krem — koyu lacivert TAMAMEN kaldırıldı. */
    --bg: #F7ECE0;
    --pipe-empty: #E0C9AF;
    --pipe-fill: #34A853;
    --pipe-glow: rgba(52, 168, 83, .38);
    --pipe-fail: #E2493D;
    --node-bg: #FFFBF5;
    --node-stroke: #D8BE9E;
    --node-active: #E2984A;
    --text: #3E2E20;
    --text-dim: #B49A7C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif;
  }
  svg#diagram {
    /* Görüş alanına SIĞDIR (letterbox), oranı KORU — hem geniş projektör
       ekranında hem dik mobil ekranda aynı diyagram bozulmadan görünür.
       Oran viewBox'ınkiyle (700×1060) BİREBİR eşleşmeli, aksi halde
       preserveAspectRatio farkı taşırıp alt/üst kırpılırdı. */
    width: min(94vw, calc(94vh * 700 / 1060));
    height: min(94vh, calc(94vw * 1060 / 700));
    display: block;
  }
  .pipe { fill: none; stroke-linecap: round; }
  .pipe-empty { stroke: var(--pipe-empty); }
  /* ÇOK YUMUŞAK dolum: uzun, yavaş başlayıp yavaş biten bir eğri (klasik
     "ease-in-out" değil — daha kadifemsi bir "ease" için özel bezier) +
     hafif yeşil parlama (drop-shadow), sert bir çizgi değil, ışıklı bir
     sıvı hissi versin diye. */
  .pipe-fill {
    stroke: var(--pipe-fill);
    transition: stroke-dashoffset 1.6s cubic-bezier(.33, .0, .18, 1);
    filter: drop-shadow(0 0 7px var(--pipe-glow));
  }
  .pipe-fill.fail { stroke: var(--pipe-fail); filter: drop-shadow(0 0 7px rgba(226, 73, 61, .35)); }

  /* Borunun içinde akan, yumuşak bulanık bir ışık noktası — CSS motion-path
     ile aynı borunun "d"sini izler. Yalnızca YENİ dolan bir boruda bir kez
     belirir, akışın bitiminde kendini kaldırır (bkz. spawnFlowDot). */
  .flow-dot {
    fill: #EFFBEF; opacity: 0; filter: blur(3px) drop-shadow(0 0 10px var(--pipe-fill));
  }
  .flow-dot.run {
    animation: flowdot var(--dur, 1.6s) cubic-bezier(.33, .0, .18, 1) forwards;
  }
  @keyframes flowdot {
    0%   { offset-distance: 0%;   opacity: 0; }
    8%   { opacity: .95; }
    88%  { opacity: .95; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  .node circle { stroke-width: 6; transition: fill .5s ease, stroke .5s ease; }
  .node.pending circle { fill: var(--node-bg); stroke: var(--node-stroke); }
  .node.active circle { fill: var(--node-bg); stroke: var(--node-active); }
  .node.done circle { fill: var(--pipe-fill); stroke: var(--pipe-fill); }
  .node.failed circle { fill: var(--pipe-fail); stroke: var(--pipe-fail); }

  /* Boru tam dolup düğüme ulaştığında YUMUŞAK bir "nefes alma" — sert bir
     zıplama değil, hafifçe büyüyüp yerine oturan bir geçiş. */
  .node { transform-box: fill-box; transform-origin: center; }
  .node.settle { animation: settle 1s cubic-bezier(.22, .7, .3, 1); }
  @keyframes settle {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }

  .node.active .ring {
    fill: none; stroke: var(--node-active); stroke-width: 4; opacity: .55;
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    from { r: var(--r0); opacity: .6; }
    to   { r: var(--r1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .node.active .ring { animation: none; }
    .node.settle { animation: none; }
    .flow-dot.run { animation: none; }
  }

  .label {
    font-size: 27px; font-weight: 700; text-anchor: middle;
    fill: var(--text-dim); transition: fill .5s ease;
  }
  .node.active .label, .node.done .label, .node.failed .label { fill: var(--text); }

  #conn {
    position: fixed; top: 18px; right: 18px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--text-dim);
  }
  #conn[data-state="live"] { background: var(--pipe-fill); }
  #conn[data-state="retry"] { background: var(--node-active); }
  #conn[data-state="error"] { background: var(--pipe-fail); }
</style>
</head>
<body>
<div id="conn" data-state="connecting"></div>
<svg id="diagram" viewBox="0 0 700 1060" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>

<script>
(() => {
  'use strict';

  const token = new URLSearchParams(location.search).get('token') || '';
  const svg = document.getElementById('diagram');
  const conn = document.getElementById('conn');
  const NS = 'http://www.w3.org/2000/svg';
  const R = 55; // düğüm yarıçapı

  /**
   * 7 düğüm — sabit koordinatlar (viewBox 700×1000). DOM ölçümü YOK; bu
   * minimal tasarımda konumlar sabit olduğu için gerekmiyor, önceki
   * sürümdeki karmaşıklığın çoğu bu sayede ortadan kalkıyor.
   */
  const NODES = {
    customer:  { x: 350, y: 75,  label: ['Müşteri'] },
    contract:  { x: 350, y: 280, label: ['Kontrat'] },
    pool1:     { x: 140, y: 500, label: ['Havuz 1', '(Esnaf Kasası)'] },
    pool3:     { x: 350, y: 500, label: ['Havuz 3', '(Sosyal)'] },
    pool4:     { x: 560, y: 500, label: ['Havuz 4', '(Operasyonel)'] },
    confirmed: { x: 350, y: 720, label: ['Onaylandı'] },
    merchant:  { x: 350, y: 925, label: ['Esnaf'] },
  };

  /** Her boru: kaynak/hedef düğüm + durumu belirleyen backend adımları. */
  const EDGES = [
    { from: 'customer', to: 'contract' },
    { from: 'contract', to: 'pool1' },
    { from: 'contract', to: 'pool3' },
    { from: 'contract', to: 'pool4' },
    { from: 'pool1', to: 'confirmed' },
    { from: 'pool3', to: 'confirmed' },
    { from: 'pool4', to: 'confirmed' },
    { from: 'confirmed', to: 'merchant' },
  ];

  let current = null;

  /**
   * Backend'in 9 gerçek adımını (FLOW_STEPS) 7 görsel düğüme indirger.
   *
   * KURAL: hiçbir düğüm/boru "olması gerekir" diye doldurulmaz — yalnızca
   * ilgili backend olayı GERÇEKTEN geldiğinde durum değişir. GİB adımı
   * (backend'de var) bu minimal görselde KASITLI olarak YOK — kullanıcı
   * yalnızca bu 7 düğümü istedi; Onaylandı → Esnaf borusu doğrudan
   * `merchant_seen` olayına bağlıdır, `gib` arka planda olur ama çizilmez.
   *
   * @param {object} flow - `/api/v1/flow/*` cevabındaki flow nesnesi.
   * @returns {Record<string, 'pending'|'active'|'done'|'failed'>}
   */
  function computeStatuses(flow) {
    const byStep = {};
    for (const e of flow.events) byStep[e.step] = e.status; // olaylar sırayla geldiği için son durum kazanır

    function group(steps) {
      if (steps.some((s) => byStep[s] === 'failed')) return 'failed';
      if (steps.every((s) => byStep[s] === 'done')) return 'done';
      return steps.some((s) => byStep[s] != null) ? 'active' : 'pending';
    }
    // ÖNEMLİ: önceki adım 'failed' olsa bile bu adım 'pending' döner, 'failed'
    // DEĞİL — çünkü bu adım GERÇEKTEN hiç başlamadı (olayı hiç gelmedi).
    // İlk denemede burada bug vardı: bir başarısızlık sonrasındaki HER ŞEY
    // kırmızıya boyanıyordu; oysa kırmızı yalnızca GERÇEKTEN başarısız olan
    // tek noktada olmalı, sonrası "hiç denenmedi" (gri) kalmalı.
    function next(prevStatus, steps) {
      if (prevStatus !== 'done') return 'pending';
      return group(steps);
    }

    const customer = group(['signed']);
    const contract = next(customer, ['received', 'fee_bump', 'submitted', 'contract']);
    // Havuz 1/3/4 AYNI 'distribution' olayına bağlı — üçü de HER ZAMAN
    // birebir aynı durumda: gerçekte atomik olduğu için, tahmini eşitleme değil.
    const poolStatus = next(contract, ['distribution']);
    const confirmed = next(poolStatus, ['caught']);
    const merchant = next(confirmed, ['merchant_seen']);

    return {
      customer, contract,
      pool1: poolStatus, pool3: poolStatus, pool4: poolStatus,
      confirmed, merchant,
    };
  }

  function edgeStatus(statuses, edge) {
    return statuses[edge.to]; // boru, HEDEF düğümün durumunu yansıtır
  }

  function pathFor(edge) {
    const a = NODES[edge.from], b = NODES[edge.to];
    // Kenar düğümün TAM merkezinden değil, dairenin kenarından başlar/biter —
    // aksi halde kalın boru dairenin arkasından taşıp "kirli" görünürdü.
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const x1 = a.x + ux * R, y1 = a.y + uy * R;
    const x2 = b.x - ux * R, y2 = b.y - uy * R;
    return `M ${x1} ${y1} L ${x2} ${y2}`;
  }

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  /** Statik diyagramı (borular boş, düğümler "pending") bir kez çizer. */
  function buildStaticDiagram() {
    svg.textContent = '';
    const frag = document.createDocumentFragment();

    for (const edge of EDGES) {
      frag.appendChild(el('path', { class: 'pipe pipe-empty', d: pathFor(edge), 'stroke-width': 26 }));
    }
    for (const edge of EDGES) {
      // Dolum katmanı — başlangıçta gizli (dash trick ilk render'da uygulanır).
      const p = el('path', { class: 'pipe pipe-fill', d: pathFor(edge), 'stroke-width': 26, 'data-edge': `${edge.from}>${edge.to}` });
      frag.appendChild(p);
    }
    for (const [key, n] of Object.entries(NODES)) {
      const g = el('g', { class: 'node pending', 'data-node': key });
      g.appendChild(el('circle', { class: 'ring', cx: n.x, cy: n.y, r: R + 10, style: `--r0:${R + 6}px; --r1:${R + 26}px` }));
      g.appendChild(el('circle', { cx: n.x, cy: n.y, r: R }));
      n.label.forEach((line, i) => {
        const dy = n.label.length === 1 ? R + 38 : R + 34 + i * 32;
        g.appendChild(el('text', { class: 'label', x: n.x, y: n.y + dy })).textContent = line;
      });
      frag.appendChild(g);
    }
    svg.appendChild(frag);
  }

  const FLOW_DURATION_MS = 1600; // .pipe-fill / .flow-dot.run CSS süresiyle BİREBİR eşleşmeli
  let supportsMotionPath = false;
  try { supportsMotionPath = CSS.supports('offset-path', "path('M0 0L1 1')"); } catch { /* eski tarayıcı — nokta efekti atlanır, boru dolumu yine çalışır */ }

  /** Önceki render'daki durumlar — yalnızca GERÇEKTEN YENİ dolan kenar/düğümde animasyon oynatmak için. */
  let prevStatuses = null;

  /**
   * Borunun içinde, kaynaktan hedefe doğru yumuşak bulanık bir ışık noktası
   * akıtır (CSS `offset-path` ile aynı boru yolunu izler). Salt görsel bir
   * ek katmandır — asıl "dolu/boş" bilgisini taşıyan katman dashoffset'li
   * `.pipe-fill`'dir; bu nokta desteklenmeyen bir tarayıcıda sessizce atlanır.
   */
  function spawnFlowDot(edge) {
    if (!supportsMotionPath) return;
    const dot = el('circle', { class: 'flow-dot', r: 9 });
    dot.style.offsetPath = `path('${pathFor(edge)}')`;
    dot.style.setProperty('--dur', `${FLOW_DURATION_MS}ms`);
    svg.appendChild(dot);
    requestAnimationFrame(() => dot.classList.add('run'));
    setTimeout(() => dot.remove(), FLOW_DURATION_MS + 200);
  }

  /**
   * Gerçek duruma göre günceller. `animate=false` ilk anlık görüntüde
   * (sayfa yeni açıldı/yeniden bağlandı) kullanılır — geçmiş adımlar
   * SIÇRAMADAN anında dolu görünür, akış/nefes efekti yalnızca YENİ
   * gelen bir olayda (bu render'da GERÇEKTEN durum değiştiğinde) oynar —
   * aksi halde her yeni olayda TÜM geçmiş borular baştan "dolarmış" gibi
   * yeniden animasyon oynardı (ilk denemede bu hataya rastlandı).
   */
  function applyStatuses(statuses, animate) {
    for (const [key, status] of Object.entries(statuses)) {
      const g = svg.querySelector(`[data-node="${key}"]`);
      if (!g) continue;
      const prevStatus = prevStatuses && prevStatuses[key];
      g.setAttribute('class', `node ${status}`);
      const justSettled = animate && prevStatus !== status && (status === 'done' || status === 'failed');
      if (justSettled) {
        g.classList.remove('settle');
        void g.getBoundingClientRect(); // olası önceki animasyonu sıfırla (reflow zorla)
        g.classList.add('settle');
      }
    }
    for (const edge of EDGES) {
      const status = edgeStatus(statuses, edge);
      const prevStatus = prevStatuses ? edgeStatus(prevStatuses, edge) : null;
      const p = svg.querySelector(`[data-edge="${edge.from}>${edge.to}"]`);
      if (!p) continue;
      const filled = status === 'done' || status === 'failed';
      const wasFilled = prevStatus === 'done' || prevStatus === 'failed';
      p.classList.toggle('fail', status === 'failed');
      const len = p.getTotalLength();
      if (!filled) {
        // GİZLE: dasharray=uzunluk + dashoffset=uzunluk → çizgi hiç boyanmaz.
        p.style.transition = 'none';
        p.setAttribute('stroke-dasharray', `${len}`);
        p.setAttribute('stroke-dashoffset', `${len}`);
        continue;
      }
      if (!animate || wasFilled) {
        // wasFilled: bu boru ÖNCEDEN de doluydu (başka bir dalın olayıyla
        // yeniden çizildi) — tekrar "akıyor" gösterip aynı animasyonu
        // baştan oynatma, doğrudan dolu göster.
        p.style.transition = 'none';
        p.setAttribute('stroke-dasharray', `${len}`);
        p.setAttribute('stroke-dashoffset', '0');
        continue;
      }
      // "Sıvı akıyor" efekti: kaynaktan hedefe doğru dolar (SVG path yönü
      // zaten kaynak→hedef olarak çizildiği için dashoffset tersten sıfıra
      // iner). Süre/eğri .pipe-fill CSS kuralında tanımlı (çok yumuşak).
      p.setAttribute('stroke-dasharray', `${len}`);
      p.setAttribute('stroke-dashoffset', `${len}`);
      p.style.transition = 'none';
      void p.getBoundingClientRect();
      p.style.transition = '';
      p.setAttribute('stroke-dashoffset', '0');
      spawnFlowDot(edge);
    }
    prevStatuses = statuses;
  }

  function render(flow, animate) {
    if (!flow) {
      applyStatuses(
        { customer: 'pending', contract: 'pending', pool1: 'pending', pool3: 'pending', pool4: 'pending', confirmed: 'pending', merchant: 'pending' },
        false
      );
      return;
    }
    applyStatuses(computeStatuses(flow), animate);
  }

  function accept(flow) {
    if (flow && current && flow.transactionId !== current.transactionId
        && new Date(flow.createdAt) < new Date(current.createdAt)) return;
    const isNewTx = !current || !flow || flow.transactionId !== current.transactionId;
    current = flow;
    render(flow, !isNewTx);
  }

  function setConn(state) {
    conn.dataset.state = state;
  }

  buildStaticDiagram();

  if (!token) {
    setConn('error');
    return;
  }

  const qs = `token=${encodeURIComponent(token)}`;
  const es = new EventSource(`/api/v1/flow/stream?${qs}`);

  es.addEventListener('open', () => setConn('live'));
  es.addEventListener('snapshot', (m) => accept(JSON.parse(m.data).flow));
  es.addEventListener('flow', (m) => accept(JSON.parse(m.data).flow));
  es.addEventListener('error', () => {
    setConn(es.readyState === EventSource.CLOSED ? 'error' : 'retry');
  });
})();
</script>
</body>
</html>
